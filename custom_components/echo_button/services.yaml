play_animation:
  target:
    entity:
      integration: echo_button
      domain: light
  fields:
    steps:
      required: true
      example: '[{"color": [255, 0, 0], "duration": 500}, {"color": "#000000", "duration": 500}]'
      selector:
        object:
    repeat:
      default: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box
